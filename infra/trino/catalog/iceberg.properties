# Trino Iceberg connector.
#
# PENTING: iceberg.catalog.type=hadoop TIDAK didukung oleh Trino.
# Nilai yang sah: hive_metastore | glue | jdbc | rest | nessie | snowflake.
# Desain ini memakai REST catalog karena Spark (writer layout) dan Trino
# (reader benchmark) harus melihat metadata tabel yang sama persis.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:ICEBERG_CATALOG_URI}
iceberg.rest-catalog.warehouse=${ENV:ICEBERG_WAREHOUSE}

fs.native-s3.enabled=true
s3.endpoint=${ENV:MINIO_ENDPOINT}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

# Jangan aktifkan caching apa pun selama main benchmark tanpa mencatatnya
# sebagai bagian dari environment freeze (G7).
