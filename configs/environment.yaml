environment:
  host:
    target_vcpu: 8
    target_ram_gb: 16
    storage: local_ssd
  deployment:
    mode: docker_compose
    colocated_minio_trino: true
    autoscaling: false
    benchmark_concurrency: 1
  freeze_before_main_run:
    - cpu_model
    - core_thread_count
    - ram
    - storage_medium
    - filesystem
    - kernel
    - docker_version
    - java_version
    - trino_version
    - iceberg_version
    - spark_version
    - minio_version

  # Batas resource ditegakkan lewat deploy.resources.limits di
  # infra/docker-compose.yml, dengan nilainya di .env. Angka di bawah harus
  # cocok dengan .env yang dipakai saat main run.
  enforced_caps:
    trino_cpus: 6
    trino_memory: 10g
    minio_cpus: 2
    minio_memory: 4g
    source_of_truth: infra/docker-compose.yml + .env

  pinned_images:
    minio: minio/minio:RELEASE.2025-04-22T22-12-26Z
    mc: minio/mc:RELEASE.2025-04-16T18-13-26Z
    iceberg_rest: apache/iceberg-rest-fixture:1.9.1
    trino: trinodb/trino:476
    spark: apache/spark:3.5.6-scala2.12-java17-python3-ubuntu
    note: "Verifikasi ketersediaan tag saat E0, lalu bekukan versi persisnya di data/manifests/environment_snapshot.yaml"

  catalog:
    type: rest
    reason: "Trino tidak mendukung iceberg.catalog.type=hadoop; Spark (writer) dan Trino (reader) harus berbagi katalog yang sama"
