queries:
  Q1:
    description: "Predicate Scan Count"
    template: >
      SELECT COUNT(*) AS n 
      FROM {table_name} 
      WHERE "Date" BETWEEN TIMESTAMP '{start_ts}' AND TIMESTAMP '{end_ts}'
  Q2:
    description: "Selective Aggregate"
    template: >
      SELECT CAST(AVG("SpeedOverGround") AS DOUBLE) AS avg_sog, 
             CAST(MAX("SpeedOverGround") AS DOUBLE) AS max_sog 
      FROM {table_name} 
      WHERE "Date" BETWEEN TIMESTAMP '{start_ts}' AND TIMESTAMP '{end_ts}'
  Q3:
    description: "Selective Group By"
    template: >
      SELECT "MessageType", COUNT(*) AS n, 
             CAST(AVG("SpeedOverGround") AS DOUBLE) AS avg_sog 
      FROM {table_name} 
      WHERE "Date" BETWEEN TIMESTAMP '{start_ts}' AND TIMESTAMP '{end_ts}' 
      GROUP BY "MessageType" 
      ORDER BY "MessageType"
  Q4:
    description: "Entity Robustness (Q4)"
    template: >
      SELECT * 
      FROM {table_name} 
      WHERE "Mmsi" = {mmsi} 
      ORDER BY "Date"

