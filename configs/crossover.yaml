crossover:
  baseline_file_size_mib: 32  # H5 fallback grid: baseline = 32 MiB
  paired_statistic: median_difference
  confidence_level: 0.95
  require_sign_change: true
  require_replicated_direction_across_main_query_family: true
  allow_uncertain_region: true
  prohibit_single_run_crossover_claim: true
